name: StudyVault CI

on:
  push:
    branches:
      - main
      - design/studyvault-premium-visuals
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Build, test and lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies and reconcile the lockfile
        run: npm install --no-audit --no-fund
      - name: Type-check and build
        run: npm run build
      - name: Run tests
        run: npm test
      - name: Lint
        run: npm run lint
